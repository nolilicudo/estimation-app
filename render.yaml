services:
  - type: web
    name: estimation-app
    env: node
    buildCommand: corepack enable pnpm && pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: estimation-app
      # Uncomment and set if your R2 bucket has public access enabled
      # - key: R2_PUBLIC_URL
      #   sync: false
